spring:
  datasource:
    url: jdbc:h2:file:./data/Chinan;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000
  h2:
    console:
      # 默认关闭：需要时用 H2_CONSOLE_ENABLED=true 显式打开
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

Chinan:
  jwt:
    secret: dev-jwt-secret-key-for-development-only-not-for-production-use

logging:
  level:
    net.alan.jupiter: DEBUG
    org.springframework.security: DEBUG