spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/Chinan
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:chinan}
    # 生产环境必须显式提供，不再使用内置默认口令
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 8
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    net.alan.jupiter: INFO

server:
  port: 8080