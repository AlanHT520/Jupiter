spring:
  application:
    name: Chinan
  profiles:
    active: dev

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  freemarker:
    template-loader-path: classpath:/templates/
    suffix: .ftl
    charset: UTF-8
    check-template-location: true

Chinan:
  jwt:
    secret: ${Chinan_JWT_SECRET:}
    expiration-ms: ${Chinan_JWT_EXPIRATION_MS:86400000}
  storage:
    upload-dir: uploads
    proof-dir: proofs

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/**,/admin-api/**