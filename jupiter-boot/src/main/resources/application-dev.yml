spring:
  datasource:
    url: jdbc:h2:file:./data/jupiter;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jupiter:
  jwt:
    secret: dev-jwt-secret-key-for-development-only-not-for-production-use

logging:
  level:
    net.alan.jupiter: DEBUG
    org.springframework.security: DEBUG