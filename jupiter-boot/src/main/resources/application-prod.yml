spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/jupiter
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:jupiter}
    password: ${DB_PASSWORD:jupiter123}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    net.alan.jupiter: INFO

server:
  port: 8080