<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>Jupiter 晚查寝管理系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.08); padding: 48px 40px; max-width: 440px; width: 100%; }
    h1 { font-size: 24px; color: #1a1a2e; margin-bottom: 8px; }
    .sub { color: #666; font-size: 14px; margin-bottom: 32px; }
    .status { background: #fffbe6; border: 1px solid #ffe58f; border-radius: 6px; padding: 16px; font-size: 14px; color: #ad8b00; margin-bottom: 24px; }
    .status b { color: #d48806; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 14px; color: #333; margin-bottom: 6px; font-weight: 500; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 14px; outline: none; transition: border-color .3s; }
    input:focus { border-color: #1677ff; }
    button { width: 100%; padding: 10px; background: #1677ff; color: #fff; border: none; border-radius: 6px; font-size: 15px; font-weight: 500; cursor: pointer; transition: background .3s; }
    button:hover { background: #4096ff; }
    .err { color: #ff4d4f; font-size: 13px; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Jupiter 晚查寝管理系统</h1>
    <p class="sub">查宿登录</p>
    <div class="form-group">
      <label>账号</label>
      <input type="text" id="username" placeholder="请输入查宿账号" />
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="password" placeholder="请输入密码" />
    </div>
    <button onclick="login()">登 录</button>
    <p id="err" class="err"></p>
  </div>
  <script>
    async function login() {
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      const e = document.getElementById('err');
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();
        if (data.code === 200) {
          localStorage.setItem('token', data.data.token);
          localStorage.setItem('username', data.data.username || u);
          localStorage.setItem('userId', data.data.userId || '');
          localStorage.setItem('role', data.data.role || '');
          window.location.href = '/admin/check.html';
        } else {
          e.textContent = '登录失败：' + (data.message || '未知错误');
        }
      } catch (ex) {
        e.textContent = '网络错误，请确认后端已启动在 localhost:8080';
      }
    }
  </script>
</body>
</html>
