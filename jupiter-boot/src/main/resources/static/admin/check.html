<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>Jupiter 查寝</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; }
    .header { background: #1a1a2e; color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 18px; }
    .header .user { font-size: 13px; color: #aaa; }
    .header button { background: #e74c3c; color: #fff; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; }
    .container { max-width: 800px; margin: 0 auto; padding: 16px; }
    .section { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    .section-title { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .section-title .badge { font-size: 12px; background: #1677ff; color: #fff; padding: 2px 8px; border-radius: 10px; }
    select, input { width: 100%; padding: 9px 12px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 14px; outline: none; }
    select:focus, input:focus { border-color: #1677ff; }
    .breadcrumb { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; font-size: 13px; color: #888; }
    .breadcrumb span { color: #333; font-weight: 500; cursor: pointer; }
    .breadcrumb span:hover { color: #1677ff; }
    .room-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
    .room-card { border: 2px solid #e8e8e8; border-radius: 8px; padding: 14px 10px; text-align: center; cursor: pointer; transition: all .2s; }
    .room-card:hover { border-color: #1677ff; box-shadow: 0 2px 8px rgba(22,119,255,.15); }
    .room-card.checked { border-color: #52c41a; background: #f6ffed; }
    .room-card .room-num { font-size: 18px; font-weight: 700; color: #1a1a2e; }
    .room-card .room-info { font-size: 12px; color: #999; margin-top: 4px; }
    .room-card.checked .room-num { color: #389e0d; }
    .room-card .check-badge { display: inline-block; font-size: 11px; margin-top: 6px; padding: 2px 8px; border-radius: 10px; }
    .room-card.checked .check-badge { background: #52c41a; color: #fff; }
    .room-card:not(.checked) .check-badge { background: #f5f5f5; color: #999; }
    .student-list { }
    .student-row { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f0f0; gap: 10px; }
    .student-row:last-child { border-bottom: none; }
    .student-info { flex: 1; min-width: 0; }
    .student-info .name { font-size: 14px; font-weight: 600; color: #333; }
    .student-info .meta { font-size: 12px; color: #999; }
    .status-btns { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
    .status-btn { padding: 5px 10px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 12px; cursor: pointer; background: #fff; transition: all .2s; white-space: nowrap; }
    .status-btn:hover { border-color: #1677ff; color: #1677ff; }
    .status-btn.active { color: #fff; border-color: transparent; }
    .status-btn.present.active { background: #52c41a; }
    .status-btn.absent.active { background: #ff4d4f; }
    .status-btn.late.active { background: #fa8c16; }
    .status-btn.leave.active { background: #722ed1; }
    .status-btn.military.active { background: #1677ff; }
    .status-btn.intern.active { background: #13c2c2; }
    .status-btn.other.active { background: #666; }
    .submit-bar { display: flex; gap: 10px; align-items: center; margin-top: 16px; padding-top: 16px; border-top: 1px solid #f0f0f0; }
    .btn { padding: 10px 24px; border: none; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all .2s; }
    .btn-primary { background: #1677ff; color: #fff; }
    .btn-primary:hover { background: #4096ff; }
    .btn-success { background: #52c41a; color: #fff; }
    .btn-success:hover { background: #73d13d; }
    .btn-outline { background: #fff; color: #1677ff; border: 1px solid #1677ff; }
    .btn-outline:hover { background: #e6f4ff; }
    .back-btn { background: none; border: none; color: #1677ff; font-size: 14px; cursor: pointer; padding: 4px 0; }
    .back-btn:hover { text-decoration: underline; }
    .empty { text-align: center; padding: 40px 0; color: #999; font-size: 14px; }
    .loading { text-align: center; padding: 20px; color: #999; }
    .err { background: #fff2f0; border: 1px solid #ffccc7; border-radius: 6px; padding: 12px; color: #ff4d4f; font-size: 13px; margin-bottom: 16px; display: none; }
    .remark-input { width: 60px; padding: 3px 6px; border: 1px solid #d9d9d9; border-radius: 3px; font-size: 11px; }
    @media (max-width: 600px) {
      .student-row { flex-direction: column; align-items: flex-start; }
      .status-btns { justify-content: flex-start; }
      .room-grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); }
    }
  </style>
</head>
<body>
<div class="header">
  <h1>Jupiter 查寝</h1>
  <span class="user" id="headerUser"></span>
  <button onclick="logout()">退出</button>
</div>
<div class="container" id="app">
  <div class="loading">加载中...</div>
</div>

<script>
const API = {
  token: localStorage.getItem('token'),
  async fetch(url, opts = {}) {
    if (!this.token) { window.location.href = '/admin/'; return; }
    const res = await fetch(url, {
      ...opts,
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.token, ...opts.headers }
    });
    if (res.status === 401 || res.status === 403) { localStorage.clear(); window.location.href = '/admin/'; return; }
    const data = await res.json();
    if (data.code !== 200) throw new Error(data.message || '请求失败');
    return data.data;
  }
};

let state = { taskId: null, buildingId: null, floorId: null, roomId: null, students: [], edited: {} };

function logout() { localStorage.clear(); window.location.href = '/admin/'; }

async function init() {
  document.getElementById('headerUser').textContent = localStorage.getItem('username') || '';
  try {
    state.taskId = null; state.buildingId = null; state.floorId = null; state.roomId = null; state.students = []; state.edited = {};
    renderTaskSelect();
  } catch(e) { showErr(e.message); }
}

async function renderTaskSelect() {
  const page = await API.fetch('/api/tasks/my?size=50');
  const tasks = page.content || page.records || page || [];
  const app = document.getElementById('app');
  if (!tasks || tasks.length === 0) {
    app.innerHTML = '<div class="section"><div class="empty">暂无查寝任务</div></div>'; return;
  }
  app.innerHTML = `
    <div class="section">
      <div class="section-title">选择任务</div>
      <select id="taskSelect" onchange="onTaskChange(this.value)">
        <option value="">-- 请选择查寝任务 --</option>
        ${tasks.map(t => `<option value="${t.id}">${t.title || t.taskNo} - ${t.taskDate} (${t.checkedRooms || 0}/${t.totalRooms || 0})</option>`).join('')}
      </select>
    </div>
    <div id="buildingArea"></div>
    <div id="floorArea"></div>
    <div id="roomArea"></div>
    <div id="checkArea"></div>
  `;
}

async function onTaskChange(taskId) {
  if (!taskId) { document.getElementById('buildingArea').innerHTML = ''; return; }
  state.taskId = taskId;
  document.getElementById('buildingArea').innerHTML = '<div class="loading">加载楼栋...</div>';
  document.getElementById('floorArea').innerHTML = '';
  document.getElementById('roomArea').innerHTML = '';
  document.getElementById('checkArea').innerHTML = '';
  try {
    renderBuildingSelect();
  } catch(e) { showErr(e.message); }
}

async function renderBuildingSelect() {
  const buildings = await API.fetch('/api/rooms/buildings');
  document.getElementById('buildingArea').innerHTML = `
    <div class="section">
      <div class="section-title">选择楼栋</div>
      <select id="buildingSelect" onchange="onBuildingChange(this.value)">
        <option value="">-- 请选择楼栋 --</option>
        ${buildings.map(b => `<option value="${b.id}">${b.name}</option>`).join('')}
      </select>
    </div>
  `;
}

async function onBuildingChange(buildingId) {
  if (!buildingId) { document.getElementById('floorArea').innerHTML = ''; return; }
  state.buildingId = buildingId; state.floorId = null; state.roomId = null;
  document.getElementById('floorArea').innerHTML = '<div class="loading">加载楼层...</div>';
  document.getElementById('roomArea').innerHTML = '';
  document.getElementById('checkArea').innerHTML = '';
  try {
    const floors = await API.fetch(`/api/rooms/buildings/${buildingId}/floors`);
    document.getElementById('floorArea').innerHTML = `
      <div class="section">
        <div class="section-title">选择楼层</div>
        <select id="floorSelect" onchange="onFloorChange(this.value)">
          <option value="">-- 请选择楼层 --</option>
          ${floors.map(f => `<option value="${f.id}">${f.floorNumber}层</option>`).join('')}
        </select>
      </div>
    `;
  } catch(e) { showErr(e.message); }
}

async function onFloorChange(floorId) {
  if (!floorId) { document.getElementById('roomArea').innerHTML = ''; return; }
  state.floorId = floorId; state.roomId = null;
  document.getElementById('roomArea').innerHTML = '<div class="loading">加载房间...</div>';
  document.getElementById('checkArea').innerHTML = '';
  try {
    const rooms = await API.fetch(`/api/rooms/floors/${floorId}?taskId=${state.taskId}`);
    renderRoomGrid(rooms);
  } catch(e) { showErr(e.message); }
}

function renderRoomGrid(rooms) {
  const checked = rooms.filter(r => r.checked).length;
  document.getElementById('roomArea').innerHTML = `
    <div class="section">
      <div class="section-title">房间列表 <span class="badge">${checked}/${rooms.length} 已查</span></div>
      <div class="room-grid">
        ${rooms.map(r => `
          <div class="room-card ${r.checked ? 'checked' : ''}" onclick="onRoomClick('${r.id}')">
            <div class="room-num">${r.roomNumber}</div>
            <div class="room-info">${r.occupiedCount || 0}/${r.bedCount || 0} 人</div>
            <div class="check-badge">${r.checked ? '已查' : '待查'}</div>
          </div>
        `).join('')}
        ${rooms.length === 0 ? '<div class="empty" style="grid-column:1/-1">该楼层暂无房间</div>' : ''}
      </div>
    </div>
  `;
}

async function onRoomClick(roomId) {
  state.roomId = roomId; state.edited = {};
  document.getElementById('checkArea').innerHTML = '<div class="loading">加载学生...</div>';
  try {
    const students = await API.fetch(`/api/rooms/${roomId}/students?taskId=${state.taskId}`);
    state.students = students;
    renderStudentCheck(students);
  } catch(e) { showErr(e.message); }
}

function renderStudentCheck(students) {
  const room = students.length > 0 ? (students[0].roomNumber || '') : '';
  document.getElementById('checkArea').innerHTML = `
    <div class="section">
      <button class="back-btn" onclick="backToRooms()">← 返回房间列表</button>
      <div class="section-title" style="margin-top:8px">${room} 房间 · 学生查寝</div>
      <div id="errMsg" class="err"></div>
      <div class="student-list">
        ${students.map((s, i) => {
          const effectiveStatus = state.edited[s.id] || s.checkStatus || s.defaultStatus || null;
          const remark = state.edited[s.id + '_remark'] !== undefined ? state.edited[s.id + '_remark'] : (s.remark || '');
          const defaultLabel = s.defaultStatus ? presetLabel(s.defaultStatus) : '';
          return `
          <div class="student-row">
            <div class="student-info">
              <div class="name">${s.name} ${s.bedNumber ? '· ' + s.bedNumber + '床' : ''}</div>
              <div class="meta">${s.studentNo || ''} ${s.className || ''} ${defaultLabel ? ' [默认:' + defaultLabel + ']' : ''}</div>
            </div>
            <div class="status-btns">
              <button class="status-btn present ${effectiveStatus === 'PRESENT' ? 'active' : ''}" onclick="setStatus('${s.id}', 'PRESENT')">在寝</button>
              <button class="status-btn leave ${(effectiveStatus === 'PERSONAL_LEAVE' || effectiveStatus === 'SICK_LEAVE' || effectiveStatus === 'LONG_SICK_LEAVE') ? 'active' : ''}" onclick="setStatus('${s.id}', '${s.defaultStatus && (s.defaultStatus === 'PERSONAL_LEAVE' || s.defaultStatus === 'SICK_LEAVE' || s.defaultStatus === 'LONG_SICK_LEAVE') ? s.defaultStatus : 'PERSONAL_LEAVE'}')">请假</button>
              <button class="status-btn absent ${effectiveStatus === 'ABSENT' ? 'active' : ''}" onclick="setStatus('${s.id}', 'ABSENT')">旷宿</button>
              <button class="status-btn military ${effectiveStatus === 'MILITARY' ? 'active' : ''}" onclick="setStatus('${s.id}', 'MILITARY')">征兵</button>
              <button class="status-btn intern ${effectiveStatus === 'INTERN' ? 'active' : ''}" onclick="setStatus('${s.id}', 'INTERN')">实习</button>
              <input class="remark-input" placeholder="备注" value="${escapeHtml(remark)}" onchange="setRemark('${s.id}', this.value)" />
            </div>
          </div>`;
        }).join('')}
        ${students.length === 0 ? '<div class="empty">该房间暂无学生</div>' : ''}
      </div>
      ${students.length > 0 ? `
      <div class="submit-bar">
        <button class="btn btn-outline" onclick="setAllPresent()">一键在寝</button>
        <div style="flex:1"></div>
        <button class="btn btn-success" onclick="submitCheck()">提交查寝</button>
      </div>` : ''}
    </div>
  `;
}

function presetLabel(status) {
  const map = { PRESENT:'在寝', PERSONAL_LEAVE:'事假', SICK_LEAVE:'病假', ABSENT:'旷宿', MILITARY:'征兵', INTERN:'实习', DAY_STUDENT:'走读', LATE_RETURN:'晚归', LONG_SICK_LEAVE:'长期病假' };
  return map[status] || status;
}

function escapeHtml(s) { return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function setStatus(studentId, status) {
  state.edited[studentId] = status;
  renderStudentCheck(state.students);
}

function setRemark(studentId, value) {
  state.edited[studentId + '_remark'] = value;
}

function setAllPresent() {
  state.students.forEach(s => { state.edited[s.id] = 'PRESENT'; });
  renderStudentCheck(state.students);
}

function backToRooms() {
  state.roomId = null; state.edited = {};
  onFloorChange(state.floorId);
}

async function submitCheck() {
  const errEl = document.getElementById('errMsg');
  errEl.style.display = 'none';
  const students = state.students.map(s => ({
    studentId: s.id,
    checkStatus: state.edited[s.id] || s.checkStatus || s.defaultStatus || 'PRESENT',
    presetStatus: s.defaultStatus || null,
    presetOverridden: !!state.edited[s.id],
    statusSource: 'WEB',
    remark: state.edited[s.id + '_remark'] !== undefined ? state.edited[s.id + '_remark'] : (s.remark || ''),
    proofFile: null
  }));

  const unset = students.filter(s => !s.checkStatus);
  if (unset.length > 0) {
    errEl.textContent = '还有学生未设置查寝状态';
    errEl.style.display = 'block';
    return;
  }

  try {
    await API.fetch(`/api/rooms/${state.roomId}/check`, {
      method: 'POST',
      body: JSON.stringify({ taskId: state.taskId, roomId: state.roomId, students: students })
    });
    state.edited = {};
    backToRooms();
  } catch(e) {
    errEl.textContent = '提交失败: ' + e.message;
    errEl.style.display = 'block';
  }
}

function showErr(msg) {
  document.getElementById('app').innerHTML = `<div class="section"><div class="err" style="display:block">${escapeHtml(msg)}</div><button class="btn btn-primary" onclick="init()">重试</button></div>`;
}

init();
</script>
</body>
</html>
