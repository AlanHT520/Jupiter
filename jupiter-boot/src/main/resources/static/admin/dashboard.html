<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>Jupiter 管理后台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; min-height: 100vh; }
    .header { background: #1a1a2e; color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
    .header-left { display: flex; align-items: center; gap: 15px; }
    .header h1 { font-size: 18px; }
    .header .user { font-size: 13px; color: #999; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .header-right .role-badge { background: #1677ff; color: #fff; font-size: 11px; padding: 2px 10px; border-radius: 10px; }
    .header-right button { background: #e74c3c; color: #fff; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; }
    .header-right .btn-check { background: #52c41a; }
    .header-right .btn-check:hover { background: #73d13d; }
    .container { max-width: 1100px; margin: 0 auto; padding: 20px 16px; }
    .tabs { display: flex; gap: 0; margin-bottom: 20px; background: #fff; border-radius: 8px 8px 0 0; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.04); }
    .tab { flex: 1; padding: 14px 24px; border: none; background: #fafafa; cursor: pointer; font-size: 15px; font-weight: 500; color: #666; transition: all .2s; border-bottom: 2px solid transparent; text-align: center; }
    .tab:hover { color: #1677ff; }
    .tab.active { color: #1677ff; background: #fff; border-bottom-color: #1677ff; }
    .panel { background: #fff; border-radius: 0 0 8px 8px; padding: 28px; box-shadow: 0 1px 4px rgba(0,0,0,.04); display: none; }
    .panel.active { display: block; }
    .form-row { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: flex-end; }
    .form-group { flex: 1; min-width: 160px; }
    .form-group label { display: block; font-size: 13px; font-weight: 500; color: #555; margin-bottom: 6px; }
    .form-group input, .form-group select { width: 100%; padding: 9px 12px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 14px; outline: none; }
    .form-group input:focus, .form-group select:focus { border-color: #1677ff; }
    .btn { padding: 9px 22px; border: none; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all .2s; white-space: nowrap; }
    .btn-primary { background: #1677ff; color: #fff; }
    .btn-primary:hover { background: #4096ff; }
    .btn-danger { background: #ff4d4f; color: #fff; }
    .btn-danger:hover { background: #ff7875; }
    .btn-outline { background: #fff; color: #1677ff; border: 1px solid #1677ff; }
    .btn-outline:hover { background: #e6f4ff; }
    .btn-sm { padding: 4px 12px; font-size: 12px; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 13px; }
    th { background: #fafafa; padding: 12px 10px; text-align: left; font-weight: 600; color: #555; border-bottom: 2px solid #f0f0f0; }
    td { padding: 10px; border-bottom: 1px solid #f0f0f0; }
    tr:hover td { background: #fafafa; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 500; }
    .badge-pending { background: #fff7e6; color: #fa8c16; }
    .badge-progress { background: #e6f7ff; color: #1677ff; }
    .badge-done { background: #f6ffed; color: #52c41a; }
    .badge-cancel { background: #fff1f0; color: #ff4d4f; }
    .err { background: #fff2f0; border: 1px solid #ffccc7; border-radius: 6px; padding: 12px; color: #ff4d4f; font-size: 13px; margin-bottom: 16px; display: none; }
    .success { background: #f6ffed; border: 1px solid #b7eb8f; border-radius: 6px; padding: 12px; color: #389e0d; font-size: 13px; margin-bottom: 16px; display: none; }
    .empty { text-align: center; padding: 40px 0; color: #999; font-size: 14px; }
    .section-title { font-size: 16px; font-weight: 600; color: #1a1a2e; margin-bottom: 18px; }
    @media (max-width: 700px) {
      .form-row { flex-direction: column; }
      .form-group { min-width: 100%; }
    }
  </style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <h1>Jupiter 管理后台</h1>
  </div>
  <div class="header-right">
    <span class="role-badge">管理员</span>
    <span class="user" id="headerUser"></span>
    <button class="btn-check" onclick="location.href='/admin/check.html'">去查寝</button>
    <button onclick="logout()">退出</button>
  </div>
</div>
<div class="container">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('tasks')">任务管理</button>
    <button class="tab" onclick="switchTab('checkers')">查宿者管理</button>
  </div>

  <div id="err" class="err"></div>
  <div id="success" class="success"></div>

  <div id="panel-tasks" class="panel active">
    <div class="section-title">创建查寝任务</div>
    <div class="form-row">
      <div class="form-group">
        <label>任务标题</label>
        <input type="text" id="taskTitle" placeholder="如：2024秋 第3周晚查寝" />
      </div>
      <div class="form-group">
        <label>任务日期</label>
        <input type="date" id="taskDate" />
      </div>
      <div class="form-group">
        <label>查寝楼栋</label>
        <select id="taskBuilding"><option value="">请选择楼栋</option></select>
      </div>
      <div class="form-group">
        <label>查寝小组</label>
        <select id="taskGroup"><option value="">请选择小组</option></select>
      </div>
      <div class="form-group">
        <label>分配给查宿者</label>
        <select id="taskChecker"><option value="">不指定（管理员自检）</option></select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group" style="max-width:200px;">
        <label>截止时间</label>
        <input type="datetime-local" id="taskDeadline" />
      </div>
      <div class="form-group" style="flex:0;">
        <label>&nbsp;</label>
        <button class="btn btn-primary" onclick="createTask()">创建任务</button>
      </div>
    </div>

    <div class="section-title" style="margin-top:32px;">任务列表</div>
    <div id="taskList"><div class="empty">加载中...</div></div>
  </div>

  <div id="panel-checkers" class="panel">
    <div class="section-title">添加查宿者</div>
    <div class="form-row">
      <div class="form-group">
        <label>姓名</label>
        <input type="text" id="counselorName" placeholder="如：张三" />
      </div>
      <div class="form-group">
        <label>登录账号</label>
        <input type="text" id="counselorUsername" placeholder="如：zhangsan" />
      </div>
      <div class="form-group">
        <label>登录密码</label>
        <input type="password" id="counselorPassword" placeholder="至少6位" />
      </div>
      <div class="form-group">
        <label>手机号（可选）</label>
        <input type="text" id="counselorPhone" placeholder="如：13800138000" />
      </div>
      <div class="form-group" style="flex:0;">
        <label>&nbsp;</label>
        <button class="btn btn-primary" onclick="createCounselor()">添加</button>
      </div>
    </div>

    <div class="section-title" style="margin-top:32px;">查宿者列表</div>
    <div id="counselorList"><div class="empty">加载中...</div></div>
  </div>
</div>

<script>
const API = {
  token: localStorage.getItem('token'),
  async fetch(url, opts = {}) {
    if (!this.token) { window.location.href = '/admin/'; return; }
    const res = await fetch(url, {
      ...opts,
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.token, ...opts.headers }
    });
    if (res.status === 401 || res.status === 403) { localStorage.clear(); window.location.href = '/admin/'; return; }
    const data = await res.json();
    if (data.code !== 200) throw new Error(data.message || '请求失败');
    return data.data;
  }
};

let currentTab = 'tasks';

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.textContent.includes(tab === 'tasks' ? '任务' : '查宿')));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + tab));
  hideMsg();
  if (tab === 'checkers') loadCheckers();
}

function hideMsg() {
  document.getElementById('err').style.display = 'none';
  document.getElementById('success').style.display = 'none';
}

function showErr(msg) {
  const el = document.getElementById('err');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('success').style.display = 'none';
}

function showSuccess(msg) {
  const el = document.getElementById('success');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('err').style.display = 'none';
}

function logout() { localStorage.clear(); window.location.href = '/admin/'; }

async function loadBuildings() {
  try {
    const list = await API.fetch('/api/rooms/buildings');
    const sel = document.getElementById('taskBuilding');
    sel.innerHTML = '<option value="">请选择楼栋</option>';
    list.forEach(b => { sel.innerHTML += `<option value="${b.id}">${b.name}</option>`; });
  } catch(e) { console.error(e); }
}

async function loadGroups() {
  try {
    const list = await API.fetch('/admin-api/groups');
    const sel = document.getElementById('taskGroup');
    sel.innerHTML = '<option value="">请选择小组</option>';
    list.forEach(g => { sel.innerHTML += `<option value="${g.id}">${g.name}</option>`; });
  } catch(e) { console.error(e); }
}

async function loadCheckersForSelect() {
  try {
    const list = await API.fetch('/admin-api/counselors/checkers');
    const sel = document.getElementById('taskChecker');
    sel.innerHTML = '<option value="">不指定（管理员自检）</option>';
    list.forEach(c => { sel.innerHTML += `<option value="${c.id}">${c.name} (${c.username})</option>`; });
  } catch(e) { console.error(e); }
}

async function loadTasks() {
  try {
    const page = await API.fetch('/admin-api/tasks?size=50&sort=createdAt,desc');
    const list = page.content || [];
    const tbody = document.getElementById('taskList');
    if (list.length === 0) {
      tbody.innerHTML = '<div class="empty">暂无任务，请先创建</div>';
      return;
    }
    let html = '<table><thead><tr><th>编号</th><th>标题</th><th>日期</th><th>楼栋</th><th>小组</th><th>查宿者</th><th>进度</th><th>状态</th><th>操作</th></tr></thead><tbody>';
    list.forEach(t => {
      const statusCls = {PENDING:'badge-pending',IN_PROGRESS:'badge-progress',COMPLETED:'badge-done',CANCELLED:'badge-cancel'}[t.status]||'';
      const statusText = {PENDING:'待开始',IN_PROGRESS:'进行中',COMPLETED:'已完成',CANCELLED:'已取消'}[t.status]||t.status;
      const checker = t.assignedCounselorName || '未指定';
      const progress = t.totalRooms ? `${t.checkedRooms}/${t.totalRooms}` : '-';
      let actions = '';
      if (t.status === 'PENDING') actions += `<button class="btn btn-primary btn-sm" onclick="startTask('${t.id}')">开始</button> `;
      if (t.status === 'IN_PROGRESS') actions += `<button class="btn btn-outline btn-sm" onclick="completeTask('${t.id}')">完成</button> `;
      if (t.status !== 'COMPLETED' && t.status !== 'CANCELLED') actions += `<button class="btn btn-danger btn-sm" onclick="cancelTask('${t.id}')">取消</button>`;
      html += `<tr><td>${t.taskNo}</td><td>${t.title}</td><td>${t.taskDate||''}</td><td>${t.buildingName||''}</td><td>${t.groupName||''}</td><td>${checker}</td><td>${progress}</td><td><span class="badge ${statusCls}">${statusText}</span></td><td>${actions||'-'}</td></tr>`;
    });
    html += '</tbody></table>';
    tbody.innerHTML = html;
  } catch(e) {
    document.getElementById('taskList').innerHTML = '<div class="err" style="display:block;">加载任务失败：' + e.message + '</div>';
  }
}

async function createTask() {
  hideMsg();
  const body = {
    title: document.getElementById('taskTitle').value,
    taskDate: document.getElementById('taskDate').value || null,
    buildingId: document.getElementById('taskBuilding').value || null,
    groupId: document.getElementById('taskGroup').value || null,
    assignedCounselorId: document.getElementById('taskChecker').value || null,
    deadlineTime: document.getElementById('taskDeadline').value ? document.getElementById('taskDeadline').value + ':00' : null
  };
  if (!body.title || !body.taskDate || !body.buildingId || !body.groupId) {
    showErr('请填写标题、日期、楼栋和小组');
    return;
  }
  try {
    await API.fetch('/admin-api/tasks', { method: 'POST', body: JSON.stringify(body) });
    showSuccess('任务创建成功');
    document.getElementById('taskTitle').value = '';
    loadTasks();
  } catch(e) { showErr(e.message); }
}

async function startTask(id) { try { await API.fetch('/admin-api/tasks/'+id+'/start', {method:'PUT'}); loadTasks(); } catch(e) { showErr(e.message); } }
async function completeTask(id) { try { await API.fetch('/admin-api/tasks/'+id+'/complete', {method:'PUT'}); loadTasks(); } catch(e) { showErr(e.message); } }
async function cancelTask(id) { try { await API.fetch('/admin-api/tasks/'+id+'/cancel', {method:'PUT'}); loadTasks(); } catch(e) { showErr(e.message); } }

async function loadCheckers() {
  try {
    const list = await API.fetch('/admin-api/counselors');
    const tbody = document.getElementById('counselorList');
    if (list.length === 0) {
      tbody.innerHTML = '<div class="empty">暂无查宿者账户</div>';
      return;
    }
    let html = '<table><thead><tr><th>姓名</th><th>账号</th><th>手机</th><th>创建时间</th><th>操作</th></tr></thead><tbody>';
    list.forEach(c => {
      html += `<tr><td>${c.name||''}</td><td>${c.username||''}</td><td>${c.phone||'-'}</td><td>${c.createdAt ? c.createdAt.substring(0,10) : ''}</td><td><button class="btn btn-danger btn-sm" onclick="deleteCounselor('${c.id}')">删除</button></td></tr>`;
    });
    html += '</tbody></table>';
    tbody.innerHTML = html;
  } catch(e) {
    document.getElementById('counselorList').innerHTML = '<div class="err" style="display:block;">加载失败：' + e.message + '</div>';
  }
}

async function createCounselor() {
  hideMsg();
  const body = {
    name: document.getElementById('counselorName').value,
    username: document.getElementById('counselorUsername').value,
    password: document.getElementById('counselorPassword').value,
    phone: document.getElementById('counselorPhone').value || null
  };
  if (!body.username || !body.password) {
    showErr('请填写账号和密码');
    return;
  }
  try {
    await API.fetch('/admin-api/counselors', { method: 'POST', body: JSON.stringify(body) });
    showSuccess('查宿者添加成功');
    document.getElementById('counselorName').value = '';
    document.getElementById('counselorUsername').value = '';
    document.getElementById('counselorPassword').value = '';
    document.getElementById('counselorPhone').value = '';
    loadCheckers();
    loadCheckersForSelect();
  } catch(e) { showErr(e.message); }
}

async function deleteCounselor(id) {
  if (!confirm('确定要删除这个查宿者吗？')) return;
  try {
    await API.fetch('/admin-api/counselors/' + id, { method: 'DELETE' });
    showSuccess('已删除');
    loadCheckers();
    loadCheckersForSelect();
  } catch(e) { showErr(e.message); }
}

function init() {
  document.getElementById('headerUser').textContent = localStorage.getItem('username') || '';
  document.getElementById('taskDate').value = new Date().toISOString().substring(0, 10);
  loadBuildings();
  loadGroups();
  loadCheckersForSelect();
  loadTasks();
}

init();
</script>
</body>
</html>
