<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>查寝房间</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="header">
        <button class="back" onclick="goBack()">←</button>
        <span class="title" id="taskTitle">查寝房间</span>
        <button class="action" id="batchSubmitBtn" onclick="batchSubmit()" style="display:none;">提交</button>
    </div>

    <div class="content">
        <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px;">
            <div>
                <div style="font-size:13px;color:var(--text-secondary);">房间完成进度</div>
                <div style="font-size:28px;font-weight:700;color:var(--primary);line-height:1.2;" id="progressText">0/0</div>
            </div>
            <div style="display:flex;gap:8px;">
                <button class="btn btn-outline" style="width:auto;padding:6px 16px;font-size:13px;border-radius:20px;" onclick="loadOverview()">刷新</button>
                <button class="btn btn-primary" id="batchSubmitBtn2" onclick="batchSubmit()" style="display:none;width:auto;padding:6px 16px;font-size:13px;border-radius:20px;">统一提交</button>
            </div>
        </div>
        <div class="progress" style="margin-bottom:18px;">
            <div class="fill" id="progressFill" style="width:0%"></div>
        </div>
        <div class="room-grid" id="roomGrid">
            <div class="spinner"></div>
        </div>
    </div>

    <div class="toast" id="globalToast"></div>

    <script src="js/common.js"></script>
    <script>
        if (!requireAuth()) throw new Error('auth');

        var taskId = getParam('taskId');
        if (!taskId) {
            document.getElementById('roomGrid').innerHTML = '<div class="empty"><div class="icon">⚠️</div><p>任务ID缺失</p></div>';
        }

        var SAVE_PREFIX = 'pe_save_' + taskId + '_';

        function showToast(msg, type) {
            var t = document.getElementById('globalToast');
            t.textContent = msg;
            t.className = 'toast show';
            if (type === 'error') t.style.background = 'rgba(255,77,79,0.9)';
            else t.style.background = 'rgba(0,0,0,0.75)';
            setTimeout(function() { t.className = 'toast'; }, 2000);
        }

        function goBack() {
            window.location.href = '/pe/index.html';
        }

        function getSavedRooms() {
            var map = {};
            for (var i = 0; i < localStorage.length; i++) {
                var key = localStorage.key(i);
                if (key && key.indexOf(SAVE_PREFIX) === 0) {
                    var roomId = key.substring(SAVE_PREFIX.length);
                    try {
                        var raw = localStorage.getItem(key);
                        map[roomId] = JSON.parse(raw);
                    } catch(e) {}
                }
            }
            return map;
        }

        function updateBatchButtons() {
            var saved = getSavedRooms();
            var count = Object.keys(saved).length;
            var show = count > 0;
            document.getElementById('batchSubmitBtn').style.display = show ? '' : 'none';
            document.getElementById('batchSubmitBtn2').style.display = show ? '' : 'none';
            if (show) {
                var label = '统一提交(' + count + ')';
                document.getElementById('batchSubmitBtn').textContent = label;
                document.getElementById('batchSubmitBtn2').textContent = label;
            }
        }

        function loadOverview() {
            var grid = document.getElementById('roomGrid');
            grid.innerHTML = '<div class="spinner"></div>';

            var savedMap = getSavedRooms();

            apiGet('/api/tasks/' + taskId + '/overview')
                .then(function(res) {
                    var data = res.data;
                    var floor = data.floor;
                    var taskInfo = data.task;

                    document.getElementById('taskTitle').textContent =
                        (taskInfo.buildingName || '') + ' ' + (floor.floorName || (floor.floorNumber + '楼'));

                    var checked = floor.checkedRoomCount || 0;
                    var total = floor.roomCount || 0;
                    var pct = total > 0 ? Math.round(checked / total * 100) : 0;
                    document.getElementById('progressText').textContent = checked + '/' + total;
                    document.getElementById('progressFill').style.width = pct + '%';

                    var rooms = floor.rooms;
                    if (!rooms || rooms.length === 0) {
                        grid.innerHTML = '<div class="empty"><div class="icon">🚪</div><p>该楼层暂无房间</p></div>';
                        updateBatchButtons();
                        return;
                    }

                    var html = '';
                    rooms.forEach(function(r) {
                        var isSaved = !!savedMap[r.roomId];
                        var isChecked = r.checked;
                        var doneCls = isChecked ? ' done' : '';
                        var savedCls = isSaved ? ' saved-local' : '';
                        html += '<div class="room-cell' + doneCls + savedCls + '" onclick="goRoom(\'' + r.roomId + '\', \'' + r.roomNumber + '\')">';
                        if (isChecked) html += '<span class="check">✓</span>';
                        if (isSaved) html += '<span class="check" style="background:var(--warning);">📝</span>';
                        html += '<span class="num">' + r.roomNumber + '</span>';
                        html += '<span class="count">' + r.studentCount + '人</span>';
                        html += '</div>';
                    });
                    grid.innerHTML = html;

                    updateBatchButtons();

                    if (taskInfo.status === 'COMPLETED') {
                        document.getElementById('batchSubmitBtn').style.display = 'none';
                        document.getElementById('batchSubmitBtn2').style.display = 'none';
                    }
                })
                .catch(function(e) {
                    grid.innerHTML = '<div class="empty"><div class="icon">⚠️</div><p>加载失败: ' + e.message + '</p></div>';
                });
        }

        function goRoom(roomId, roomNumber) {
            window.location.href = '/pe/room.html?taskId=' + taskId + '&roomId=' + roomId + '&roomNumber=' + encodeURIComponent(roomNumber);
        }

        function batchSubmit() {
            var savedMap = getSavedRooms();
            var roomIds = Object.keys(savedMap);
            if (roomIds.length === 0) {
                showToast('没有可提交的数据', 'error');
                return;
            }

            var submissions = [];
            roomIds.forEach(function(roomId) {
                var selectionMap = savedMap[roomId];
                var studentIds = Object.keys(selectionMap);
                if (studentIds.length === 0) return;

                var items = [];
                studentIds.forEach(function(sid) {
                    items.push({
                        studentId: sid,
                        checkStatus: selectionMap[sid],
                        presetStatus: null,
                        presetOverridden: false,
                        statusSource: 'MANUAL',
                        remark: null,
                        proofFile: null
                    });
                });

                submissions.push({
                    taskId: taskId,
                    roomId: roomId,
                    students: items
                });
            });

            if (submissions.length === 0) {
                showToast('没有可提交的数据', 'error');
                return;
            }

            var btn1 = document.getElementById('batchSubmitBtn');
            var btn2 = document.getElementById('batchSubmitBtn2');
            btn1.disabled = true;
            btn2.disabled = true;
            btn1.textContent = '提交中...';
            btn2.textContent = '提交中...';

            apiPost('/api/rooms/batch-check', submissions)
                .then(function() {
                    roomIds.forEach(function(roomId) {
                        localStorage.removeItem(SAVE_PREFIX + roomId);
                    });
                    showToast('提交成功！共提交 ' + submissions.length + ' 个房间');
                    btn1.style.display = 'none';
                    btn2.style.display = 'none';
                    setTimeout(function() { loadOverview(); }, 800);
                })
                .catch(function(e) {
                    showToast('提交失败: ' + e.message, 'error');
                    btn1.disabled = false;
                    btn2.disabled = false;
                    btn1.textContent = '统一提交';
                    btn2.textContent = '统一提交';
                });
        }

        loadOverview();
    </script>
</body>
</html>
