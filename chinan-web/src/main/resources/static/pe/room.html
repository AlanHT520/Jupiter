<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>查寝登记</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="header">
        <button class="back" onclick="goBack()">←</button>
        <span class="title" id="roomTitle">查寝登记</span>
    </div>
    <div class="content" id="studentList" style="padding-bottom:90px;">
        <div class="spinner"></div>
    </div>
    <div class="submit-bar">
        <button class="btn btn-primary" onclick="saveLocal()" id="saveBtn">保存</button>
        <div style="text-align:center;font-size:12px;color:var(--text-secondary);margin-top:6px;">
            选好状态后点保存，回到任务页统一提交
        </div>
    </div>

    <div class="toast" id="globalToast"></div>

    <script src="js/common.js"></script>
    <script>
        if (!requireAuth()) throw new Error('auth');

        var taskId = getParam('taskId');
        var roomId = getParam('roomId');
        var roomNumber = decodeURIComponent(getParam('roomNumber') || '');

        document.getElementById('roomTitle').textContent = roomNumber || '查寝登记';

        function goBack() {
            window.location.href = '/pe/task.html?taskId=' + taskId;
        }

        function showToast(msg, type) {
            var t = document.getElementById('globalToast');
            t.textContent = msg;
            t.className = 'toast show';
            if (type === 'error') t.style.background = 'rgba(255,77,79,0.9)';
            else t.style.background = 'rgba(0,0,0,0.75)';
            setTimeout(function() { t.className = 'toast'; }, 1500);
        }

        var studentsData = [];
        var localSaveKey = 'pe_save_' + taskId + '_' + roomId;

        function loadLocal() {
            try {
                var raw = localStorage.getItem(localSaveKey);
                if (raw) return JSON.parse(raw);
            } catch(e) {}
            return {};
        }

        function loadStudents() {
            var container = document.getElementById('studentList');
            container.innerHTML = '<div class="spinner"></div>';

            var localMap = loadLocal();

            apiGet('/api/rooms/' + roomId + '/students?taskId=' + taskId)
                .then(function(res) {
                    var list = res.data || [];
                    if (!list || list.length === 0) {
                        container.innerHTML = '<div class="empty"><div class="icon">👤</div><p>该房间暂无学生</p></div>';
                        return;
                    }
                    studentsData = list.map(function(s) {
                        var preset = s.presetStatus || '';
                        var hasRecord = s.checkStatus && s.checkStatus !== 'null';
                        var localSelection = localMap[s.id] || null;
                        return {
                            id: s.id,
                            name: s.name || '',
                            gender: s.gender || '',
                            className: s.className || '',
                            bedNo: s.bedNumber || '',
                            defaultStatus: s.defaultStatus || 'PRESENT',
                            presetStatus: preset,
                            checkStatus: hasRecord ? s.checkStatus : null,
                            statusSource: s.statusSource || '',
                            _selected: localSelection || (hasRecord ? s.checkStatus : null)
                        };
                    });
                    renderStudents(container);
                })
                .catch(function(e) {
                    container.innerHTML = '<div class="empty"><div class="icon">⚠️</div><p>加载失败: ' + e.message + '</p></div>';
                });
        }

        function getEffective(s) {
            return s._selected || s.checkStatus || s.defaultStatus || 'PRESENT';
        }

        function getLabel(status) {
            switch (status) {
                case 'PRESENT':        return '在寝';
                case 'ABSENT':         return '不在';
                case 'PERSONAL_LEAVE': return '事假';
                case 'SICK_LEAVE':     return '病假';
                case 'LONG_SICK_LEAVE':return '长病假';
                case 'LATE_RETURN':    return '晚归';
                case 'MILITARY':       return '征兵';
                case 'INTERN':         return '实习';
                case 'DAY_STUDENT':    return '走读';
                default: return status || '在寝';
            }
        }

        function renderStudents(container) {
            var html = '';
            studentsData.forEach(function(s, idx) {
                var eff = getEffective(s);
                var hasPreset = s.presetStatus && s.presetStatus !== 'PRESENT';
                html += '<div class="student-card" data-idx="' + idx + '">';
                html += '<div class="head">';
                var avCls = s.gender === '女' ? ' female' : '';
                html += '<div class="avatar' + avCls + '">' + esc(s.name ? s.name.charAt(0) : '?') + '</div>';
                html += '<div class="info">';
                html += '<div class="name">' + esc(s.name) + '</div>';
                html += '<div class="meta">' + esc(s.className) + (s.bedNo ? ' · ' + esc(s.bedNo) + '床' : '') + '</div>';
                html += '<div class="badge-row">';
                if (hasPreset) {
                    html += '<span class="badge badge-gray">预置: ' + getLabel(s.presetStatus) + '</span>';
                }
                html += '<span class="badge badge-blue" id="selLabel' + idx + '">' + getLabel(eff) + '</span>';
                html += '</div>';
                html += '</div>';
                html += '</div>';
                html += '<div class="chips" id="chips' + idx + '">';
                html += '</div>';
                html += '</div>';
            });
            container.innerHTML = html;

            studentsData.forEach(function(s, idx) {
                var chipsEl = document.getElementById('chips' + idx);
                var eff = getEffective(s);
                renderChips(chipsEl, idx, eff);
            });
        }

        function renderChips(chipsEl, idx, eff) {
            var options = [
                { v: 'PRESENT', l: '在寝', cls: 'present' },
                { v: 'ABSENT', l: '不在', cls: 'absent' },
                { v: 'PERSONAL_LEAVE', l: '事假' },
                { v: 'SICK_LEAVE', l: '病假' },
                { v: 'LONG_SICK_LEAVE', l: '长病假' },
                { v: 'LATE_RETURN', l: '晚归' }
            ];

            options.forEach(function(o) {
                var span = document.createElement('span');
                span.textContent = o.l;
                span.className = 'chip';
                if (o.cls) span.className += ' ' + o.cls;
                if (eff === o.v) span.className += ' on';
                span.onclick = function() { selectChip(idx, o.v); };
                chipsEl.appendChild(span);
            });
        }

        function selectChip(idx, status) {
            studentsData[idx]._selected = status;
            var chipsEl = document.getElementById('chips' + idx);
            chipsEl.innerHTML = '';
            renderChips(chipsEl, idx, status);
            document.getElementById('selLabel' + idx).textContent = getLabel(status);
        }

        function saveLocal() {
            if (!studentsData || studentsData.length === 0) {
                showToast('没有可保存的数据', 'error');
                return;
            }

            var map = {};
            studentsData.forEach(function(s) {
                var status = s._selected || s.checkStatus || s.defaultStatus || 'PRESENT';
                map[s.id] = status;
            });

            localStorage.setItem(localSaveKey, JSON.stringify(map));
            showToast('已保存');
            setTimeout(function() { goBack(); }, 400);
        }

        loadStudents();
    </script>
</body>
</html>
